judges:
- name: qwen3.5-4b-awq (fast)
  command: python -m vllm.entrypoints.openai.api_server --model /mnt/truenas/qwen3_5_AWQ_4bit --served-model-name judge --port 8009 --gpu-memory-utilization 0.9 --max-model-len 16384 --max-num-seqs 32 --enable-prefix-caching
- name: qwen3.5-4b(judge)
  command: python -m vllm.entrypoints.openai.api_server --model /mnt/truenas/qwen3-5_4b --served-model-name judge --port 8009 --gpu-memory-utilization 0.9 --max-model-len 16384 --max-num-seqs 32 --enable-prefix-caching
- name: qwen3-30b (accurate)
  command: python -m vllm.entrypoints.openai.api_server --model /mnt/newdisk/neel/whisper_to_fasterwhisper/model/model_qwen3_6_coding --served-model-name qwen3b --port 8008 --dtype bfloat16 --gpu-memory-utilization 0.95 --enable-auto-tool-choice --tool-call-parser qwen3_coder --kv-cache-dtype auto --max-num-seqs 2 --max-num-batched-tokens 2096 --enable-prefix-caching --tensor-parallel-size 1 --disable-log-stats --reasoning-parser qwen3
default_judge: qwen3.5-4b(judge)
test_model_presets:
- name: qwen3.5-4b
  command: python -m vllm.entrypoints.openai.api_server --model /mnt/truenas/qwen3-5_4b --served-model-name test --port 8001 --gpu-memory-utilization 0.9 --max-model-len 40960 --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
- name: qwen3.5-4b(small_awq)
  command: python -m vllm.entrypoints.openai.api_server --model /mnt/truenas/qwen3_5_AWQ_4bit --served-model-name test --port 8001 --gpu-memory-utilization 0.9 --max-model-len 40960 --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
- name: small_model
  command: python -m vllm.entrypoints.openai.api_server --model /mnt/truenas/qwen3_5_AWQ_4bit --served-model-name test --host 0.0.0.0 --port 8001 --gpu-memory-utilization 0.90 --max-model-len 40960 --max-num-seqs 16 --max-num-batched-tokens 8192 --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
run:
  default_system_prompt: Answer the user's question. Think briefly and do not repeat yourself. As soon as you know the answer, stop thinking and give the final answer.
  quick_size: 100
  seed: 42
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
  max_tokens: 32384
  parallel_requests: 4
  code_test_timeout_sec: 10
  server_start_timeout_sec: 900
  request_timeout_sec: 900
  judge_timeout_sec: 600
  request_retries: 1
  judge_max_tokens: 512
  agent_max_steps: 250
  agent_step_max_tokens: 16384
  agent_command_timeout_sec: 120
  agent_output_chars: 10000
  agent_task_timeout_sec: 1800
  agent_verifier_timeout_sec: 1800
paths:
  raw_datasets: /mnt/truenas/llm_eval_datasets/raw
  data: data
